[package]
name = "pneuma"
version = "0.3.1"
description = "AI-Powered Live Voice-to-Scripture Canvas"
authors = ["Pneuma Team"]
edition = "2021"

[lib]
name = "pneuma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
quick-xml = "0.36"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
open = "5"
urlencoding = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# NDI broadcast (optional — requires NDI SDK 6.x installed to build)
grafton-ndi = { version = "1.0", optional = true }
xcap = { version = "0.8", optional = true }

[features]
ndi = ["dep:grafton-ndi", "dep:xcap"]
