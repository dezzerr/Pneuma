name: Build Windows Installer

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create placeholder API key
        shell: bash
        run: echo "" > src-tauri/api_bible_key.txt

      - name: Build Python sidecar
        shell: bash
        run: |
          python -m venv sidecar/.venv
          sidecar/.venv/Scripts/python.exe -m pip install --upgrade pip
          sidecar/.venv/Scripts/python.exe -m pip install -r sidecar/requirements.txt
          sidecar/.venv/Scripts/python.exe -m pip install -r sidecar/requirements-packaging.txt
          cd sidecar
          .venv/Scripts/python.exe -m PyInstaller pneuma_sidecar.spec --noconfirm

      - name: Build Tauri app
        shell: bash
        run: npm run tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: pneuma-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: pneuma-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
